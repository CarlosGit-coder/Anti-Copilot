[project]
name = "anti-copilot"
version = "0.1.0"
description = "Assistente de arquitetura de software orientado por RAG"
readme = "README.md"
authors = [
    { name = "CarlosGit-coder", email = "carlosgabrielmonteiro2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0,<2.0",
    "google-genai>=1.0,<4.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pypdf>=6.0,<7.0",
    "fastembed>=0.9,<1.0",
    "streamlit>=1.40,<2.0",
]

[project.scripts]
anti-copilot = "anti_copilot.app:main"
anti-copilot-knowledge = "anti_copilot.knowledge_cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
