[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-copilot"
version = "0.1.0"
description = "Chatbot local de memória de projeto com RAG e ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastembed>=0.9,<1.0",
    "requests>=2.31,<3.0",
    "streamlit>=1.40,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anti_copilot*"]

[tool.setuptools.package-dir]
"" = "src"
